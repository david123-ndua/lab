
<!DOCTYPE html>
<html>
<head>
    <title>Finding by Name</title>
</head>
<body>

    <p name="student">David</p>
    <p name="student">Mary</p>
    <p name="student">John</p>

    <hr>

    <p id="demo"></p>

    <script>
        var x = document.getElementsByName("student");

        document.getElementById("demo").innerHTML =
        x[0].innerHTML;
    </script>

</body>
</html>
